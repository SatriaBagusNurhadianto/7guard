# Hardened rule set - every change is backed by a real bypass that was sent
# and observed, plus a false-positive measurement. See docs/security-hardening.
- id: sqli-union-select
  category: sqli
  severity: high
  pattern: "union[\\s\\x0b\\x07\\x1a\\xa0]*\\(*\\s*select"
  locations: [query, body, path, header]
  description: "SQL UNION SELECT injection"

- id: sqli-union-all-select
  category: sqli
  severity: high
  pattern: "union[\\s\\x0b\\x07\\x1a\\xa0]*\\(*\\s*all\\s+select"
  locations: [query, body, path]
  description: "SQL UNION ALL SELECT injection"

- id: sqli-or-true
  category: sqli
  severity: high
  pattern: "or\\s*\\(*\\s*1\\s*=\\s*1"
  locations: [query, body, path, header]
  description: "Boolean-based SQLi (OR 1=1)"

- id: sqli-or-true-quote
  category: sqli
  severity: high
  pattern: "or\\s+'[^']*'\\s*=\\s*'[^']*'?"
  locations: [query, body, path]
  description: "Boolean-based SQLi with quotes"

- id: sqli-drop-table
  category: sqli
  severity: critical
  pattern: "drop\\s+table"
  locations: [query, body, path]
  description: "DROP TABLE injection"

- id: sqli-insert-into
  category: sqli
  severity: high
  pattern: "insert\\s+into"
  locations: [query, body, path]
  description: "INSERT INTO injection"

- id: sqli-delete-from
  category: sqli
  severity: high
  pattern: "delete\\s+from"
  locations: [query, body, path]
  description: "DELETE FROM injection"

- id: sqli-update-set
  category: sqli
  severity: high
  pattern: "update\\s+\\w+\\s+set"
  locations: [query, body, path]
  description: "UPDATE SET injection"

- id: sqli-comment-dash
  category: sqli
  severity: medium
  pattern: "--\\s*$"
  locations: [query, body, path]
  description: "SQL comment (--) at end of input"

- id: sqli-comment-hash
  category: sqli
  severity: medium
  pattern: "#\\s*$"
  locations: [query, body, path]
  description: "SQL comment (#) at end of input"

- id: sqli-sleep
  category: sqli
  severity: high
  pattern: "sleep\\s*\\("
  locations: [query, body, path, header]
  description: "Time-based SQLi (SLEEP)"

- id: sqli-benchmark
  category: sqli
  severity: high
  pattern: "benchmark\\s*\\("
  locations: [query, body, path]
  description: "Time-based SQLi (BENCHMARK)"

- id: sqli-waitfor
  category: sqli
  severity: high
  pattern: "waitfor\\s+delay"
  locations: [query, body, path]
  description: "Time-based SQLi (WAITFOR DELAY)"

- id: sqli-exec
  category: sqli
  severity: critical
  pattern: "exec\\s*\\("
  locations: [query, body, path]
  description: "Stored procedure execution"

- id: sqli-xp-cmdshell
  category: sqli
  severity: critical
  pattern: "xp_cmdshell"
  locations: [query, body, path]
  description: "SQL Server xp_cmdshell"

- id: sqli-information-schema
  category: sqli
  severity: medium
  pattern: "information_schema"
  locations: [query, body, path]
  description: "Information schema enumeration"

- id: sqli-concat
  category: sqli
  severity: medium
  pattern: "concat\\s*\\("
  locations: [query, body, path]
  description: "CONCAT function (potential data exfiltration)"

- id: sqli-having
  category: sqli
  severity: medium
  pattern: "having\\s+1\\s*=\\s*1"
  locations: [query, body, path]
  description: "HAVING 1=1 injection"

- id: sqli-order-by
  category: sqli
  severity: low
  pattern: "order\\s+by\\s+\\d+"
  locations: [query, body, path]
  description: "ORDER BY column enumeration"

- id: sqli-group-by
  category: sqli
  severity: low
  pattern: "group\\s+by\\s+\\d+"
  locations: [query, body, path]
  description: "GROUP BY column enumeration"

- id: sqli-hex-literal
  category: sqli
  severity: high
  pattern: "0x[0-9a-f]{12,}"
  locations: [query, body, path, header]
  description: "Hex literal token building (MySQL evasion)"
- id: sqli-char-codes
  category: sqli
  severity: high
  pattern: "char\\s*\\(\\s*\\d{2,}"
  locations: [query, body, path]
  description: "CHAR() code-point token building"
- id: sqli-oracle-time
  category: sqli
  severity: high
  pattern: "dbms_(?:pipe|lock|session)|utl_http|utl_tcp"
  locations: [query, body, path]
  description: "Oracle time/IO functions"
- id: sqli-glued-keywords
  category: sqli
  severity: high
  pattern: "unionselect|selectunion"
  locations: [query, body, path]
  description: "Keywords fused after null-byte stripping"
- id: sqli-unicode-escape
  category: sqli
  severity: high
  pattern: "%u00(?:20|25|09|0a|0d|0b|27|22|3d|28|29|a0)"
  locations: [query, body, path]
  description: "IIS/ASP %uXXXX escape of whitespace/quote/operator (backend-dependent)"
- id: sqli-alt-separator
  category: sqli
  severity: high
  pattern: "union[`\\{\\[\\]]select"
  locations: [query, body, path]
  description: "Non-whitespace separator between UNION and SELECT"
- id: sqli-concat-hex
  category: sqli
  severity: high
  pattern: "concat\\s*\\(\\s*0x"
  locations: [query, body, path]
  description: "CONCAT() of hex literals (token building)"
