name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt check
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: go build
        run: go build ./...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: fuzz detector
        run: |
          for t in FuzzNormalize FuzzSingleDecode FuzzDetect FuzzDetectString FuzzDetectRequest; do
            go test -run='^$' -fuzz="^${t}$" -fuzztime=30s ./internal/detector/ || exit 1
          done
      - name: fuzz egress
        run: |
          for t in FuzzNormalizeHost FuzzNewAllowlist FuzzCheck FuzzCheckIP FuzzURLParse; do
            go test -run='^$' -fuzz="^${t}$" -fuzztime=30s ./internal/egress/ || exit 1
          done
      - name: fuzz config
        run: |
          for t in FuzzValidate FuzzEgressHosts; do
            go test -run='^$' -fuzz="^${t}$" -fuzztime=30s ./internal/config/ || exit 1
          done

  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t 7guard:latest .
      - name: Smoke test
        run: |
          docker compose -f deploy/compose.lite.yml up -d
          sleep 5
          curl -f http://localhost:8080/health
          docker compose -f deploy/compose.lite.yml down
